[package]
name = "till"
version = "0.1.0"
description = "Rajista Pay: on-chain shop bills paid in USDC"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "till"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "1.2.0"
anchor-spl = "1.2.0"
